name: Platform tests - Core

on:
    schedule:
        # Runs at the start of every hour
        - cron: '0 * * * *'
    workflow_dispatch:

jobs:
    platformTestsCore:
        uses: apify/apify-test-tools/.github/workflows/public_platform-tests.yaml@master
        with:
            test-files-glob: 'test/platform/core/**'
            # report-slack-channel: '#notif-<repo-name>'
        secrets: inherit
